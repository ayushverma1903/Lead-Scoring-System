version: '3.8'

services:
  api:
    build: .
    container_name: lead_scoring_api
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app

  frontend:
    build: .
    container_name: lead_scoring_frontend
    ports:
      - "8501:8501"
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    volumes:
      - .:/app
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
